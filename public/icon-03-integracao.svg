<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- spokes -->
  <g stroke="#5FB8FF" stroke-width="1.8" opacity="0.7">
    <line x1="120" y1="120" x2="55"  y2="55"/>
    <line x1="120" y1="120" x2="185" y2="55"/>
    <line x1="120" y1="120" x2="55"  y2="185"/>
    <line x1="120" y1="120" x2="185" y2="185"/>
    <line x1="120" y1="120" x2="120" y2="45"/>
  </g>

  <!-- outer nodes (squares) -->
  <g fill="none" stroke="#6BC2FF" stroke-width="2.4" filter="url(#glow3)">
    <rect x="42"  y="42"  width="24" height="24" rx="4"/>
    <rect x="174" y="42"  width="24" height="24" rx="4"/>
    <rect x="42"  y="174" width="24" height="24" rx="4"/>
    <rect x="174" y="174" width="24" height="24" rx="4"/>
    <rect x="108" y="26"  width="24" height="24" rx="4"/>
  </g>

  <!-- central hub -->
  <g filter="url(#glow3)">
    <rect x="104" y="104" width="32" height="32" rx="6" fill="#2E6FCB"/>
    <rect x="104" y="104" width="32" height="32" rx="6" fill="none" stroke="#9FE8FF" stroke-width="2"/>
  </g>

  <!-- accent particles -->
  <g fill="#9FE8FF" filter="url(#glow3)">
    <circle cx="85" cy="85" r="1.8"/>
    <circle cx="155" cy="85" r="1.6"/>
    <circle cx="85" cy="155" r="1.6"/>
    <circle cx="155" cy="155" r="1.8"/>
  </g>
</svg>
